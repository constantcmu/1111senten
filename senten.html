<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluent Flashcards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* CSS: Minimalist, Bright & Learning-Focused */
        :root {
            --bg-body: #f8fafc;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --highlight: #fef08a;
            --highlight-text: #854d0e;
            --font-main: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin-top: 0;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-weight: 800;
            font-size: 2rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .stats {
            font-size: 0.9rem;
            color: var(--text-muted);
            background: #fff;
            padding: 6px 16px;
            border-radius: 99px;
            border: 1px solid #e2e8f0;
            display: inline-block;
        }

        .stats span { color: var(--primary); font-weight: 600; }

        .controls {
            display: flex;
            gap: 12px;
            margin: 24px 0;
        }

        input, select {
            background: #fff;
            border: 1px solid #e2e8f0;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        input { flex: 1; }

        /* Flashcard Design */
        .flashcard {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            border: 1px solid #f1f5f9;
        }

        .flashcard:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .flashcard .status-badge {
            position: absolute;
            top: 20px;
            right: 24px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 4px 12px;
            border-radius: 99px;
            background: #f1f5f9;
            color: var(--text-muted);
        }

        .flashcard.mastered .status-badge {
            background: #dcfce7;
            color: #166534;
        }

        .main-sentence {
            font-size: 1.8rem;
            font-weight: 600;
            text-align: center;
            line-height: 1.4;
            margin-bottom: 30px;
            color: var(--primary);
        }

        .answer-area {
            border-top: 1px solid #f1f5f9;
            padding-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: opacity 0.3s;
        }

        .answer-area.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .line {
            display: flex;
            font-size: 1.1rem;
            align-items: baseline;
        }

        .label {
            width: 60px;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--text-muted);
            flex-shrink: 0;
            letter-spacing: 1px;
        }

        .content { flex: 1; }
        .content span {
            background: var(--highlight);
            color: var(--highlight-text);
            padding: 0 4px;
            border-radius: 4px;
            font-weight: 600;
        }

        .hint-text {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 20px;
        }

        /* Buttons */
        .actions {
            display: flex;
            gap: 16px;
        }

        button {
            flex: 1;
            cursor: pointer;
            font-weight: 600;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 1rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #btnRandom {
            background: var(--primary);
            color: white;
        }

        #btnRandom:hover { background: var(--primary-hover); }

        #btnMastered {
            background: #fff;
            color: var(--text-main);
            border: 1px solid #e2e8f0;
        }

        #btnMastered:hover:not(:disabled) {
            background: #f8fafc;
            border-color: var(--success);
            color: var(--success);
        }

        #btnMastered:disabled { opacity: 0.5; cursor: not-allowed; }

        .mastered-icon { display: none; }
        .mastered .mastered-icon { display: inline; }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Fluent Flashcards</h1>
            <div class="stats">
                Progress: <span id="masteredCount">0</span> / <span id="totalCount">0</span>
            </div>
            <div class="controls">
                <input type="text" id="searchInput" placeholder="Search...">
                <select id="groupFilter">
                    <option value="all">All Groups</option>
                </select>
            </div>
        </header>

        <div class="flashcard" id="flashcard">
            <div class="status-badge" id="cardStatus">Learning</div>
            
            <div id="text-en" class="main-sentence"></div>

            <div class="info-area" id="infoArea">
                <div class="line"><span class="label">IPA</span> <span id="text-ipa" class="content"></span></div>
                <div class="line"><span class="label">中文</span> <span id="text-ch" class="content"></span></div>
                <div class="line"><span class="label">PINYIN</span> <span id="text-py" class="content"></span></div>
            </div>

            <div class="answer-area hidden" id="answerArea">
                <div class="line"><span class="label">THAI</span> <span id="text-th" class="content" style="font-weight: 600; color: var(--primary);"></span></div>
            </div>

            <div class="hint-text" id="hintText">Tap to reveal Thai translation</div>
        </div>

        <div class="actions">
            <button id="btnRandom">Next Card ➔</button>
            <button id="btnMastered">Mark Mastered</button>
        </div>
    </div>

    <script>

        // State Management
        let sentences = [];
        let masteredIds = [];
        try {
            const saved = localStorage.getItem('cyberpunk_mastered_data');
            masteredIds = saved ? JSON.parse(saved) : [];
            if (!Array.isArray(masteredIds)) masteredIds = [];
        } catch (e) {
            masteredIds = [];
        }
        
        let filteredSentences = [];
        let currentSentence = null;
        let isRevealed = false;

        // DOM Elements
        const elSearch = document.getElementById('searchInput');
        const elGroup = document.getElementById('groupFilter');
        const elMasteredCount = document.getElementById('masteredCount');
        const elTotalCount = document.getElementById('totalCount');
        const btnRandom = document.getElementById('btnRandom');
        const btnMastered = document.getElementById('btnMastered');
        const flashcard = document.getElementById('flashcard');
        const answerArea = document.getElementById('answerArea');
        const hintText = document.getElementById('hintText');
        const cardStatus = document.getElementById('cardStatus');

        // Fetch data
        async function loadData() {
            try {
                const response = await fetch('./data_with_highlights.txt');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                sentences = await response.json();
                init();
            } catch (error) {
                console.error("Detailed Error:", error);
                
                const isLocal = window.location.protocol === 'file:';
                let errorMsg = "<b>Error loading data.</b><br>";
                
                if (isLocal) {
                    errorMsg += "<small>⚠️ Browser blocks local files. <br>Please open via <b>Live Server</b> in VS Code.</small>";
                } else {
                    errorMsg += `<small>${error.message}</small>`;
                }
                
                document.getElementById('text-en').innerHTML = errorMsg;
                document.getElementById('text-en').style.fontSize = "1.2rem";
                hintText.style.display = 'none';
            }
        }

        function init() {
            filteredSentences = [...sentences];
            elTotalCount.textContent = sentences.length;
            populateGroups();
            updateStats();
            filterData();
            
            elSearch.addEventListener('input', filterData);
            elGroup.addEventListener('change', filterData);
            btnRandom.addEventListener('click', (e) => {
                e.stopPropagation();
                getRandomCard();
            });
            btnMastered.addEventListener('click', (e) => {
                e.stopPropagation();
                markMastered();
            });
            flashcard.addEventListener('click', toggleReveal);

            // Keyboard support
            window.addEventListener('keydown', (e) => {
                if (document.activeElement.tagName === 'INPUT') return; // Don't trigger if searching
                
                if (e.code === 'Space') {
                    e.preventDefault();
                    if (!isRevealed) toggleReveal();
                    else getRandomCard();
                }
                if (e.code === 'Enter') {
                    if (!isRevealed) toggleReveal();
                }
            });
        }

        function populateGroups() {
            const groups = [...new Set(sentences.map(s => s.group))];
            groups.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.textContent = g;
                elGroup.appendChild(opt);
            });
        }

        function filterData() {
            const term = elSearch.value.toLowerCase();
            const group = elGroup.value;
            filteredSentences = sentences.filter(s => {
                const matchGroup = group === 'all' || s.group === group;
                const rawText = `${s.en} ${s.ch} ${s.py} ${s.th}`.replace(/<[^>]*>?/gm, '').toLowerCase();
                return matchGroup && rawText.includes(term);
            });
            getRandomCard();
        }

        function getRandomCard() {
            if (filteredSentences.length === 0) return;
            const randomIndex = Math.floor(Math.random() * filteredSentences.length);
            currentSentence = filteredSentences[randomIndex];
            isRevealed = false;
            renderCard(currentSentence);
        }

        function toggleReveal() {
            isRevealed = !isRevealed;
            if (isRevealed) {
                answerArea.classList.remove('hidden');
                hintText.style.display = 'none';
            } else {
                answerArea.classList.add('hidden');
                hintText.style.display = 'block';
            }
        }

        function renderCard(sentence) {
            document.getElementById('text-en').innerHTML = sentence.en;
            document.getElementById('text-ipa').innerHTML = sentence.ipa;
            document.getElementById('text-ch').innerHTML = sentence.ch;
            document.getElementById('text-py').innerHTML = sentence.py;
            document.getElementById('text-th').innerHTML = sentence.th;

            const isMastered = masteredIds.includes(sentence.id);
            if (isMastered) {
                flashcard.classList.add('mastered');
                cardStatus.textContent = "Mastered";
                btnMastered.disabled = true;
                btnMastered.textContent = "✓ Mastered";
            } else {
                flashcard.classList.remove('mastered');
                cardStatus.textContent = "Learning";
                btnMastered.disabled = false;
                btnMastered.textContent = "Mark Mastered";
            }
            
            // Reset reveal state for new card (THAI only)
            answerArea.classList.add('hidden');
            hintText.style.display = 'block';
        }

        function markMastered() {
            if (!currentSentence || masteredIds.includes(currentSentence.id)) return;
            masteredIds.push(currentSentence.id);
            localStorage.setItem('cyberpunk_mastered_data', JSON.stringify(masteredIds));
            updateStats();
            renderCard(currentSentence);
        }

        function updateStats() {
            elMasteredCount.textContent = masteredIds.length;
        }

        loadData();
    </script>
</body>
</html>
