
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1,111 Sentences - Printable Flashcards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* CSS สำหรับจัดหน้ากระดาษ A4 */
        :root {
            --font-main: 'Prompt', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            font-family: var(--font-main);
            margin: 0;
            padding: 20px;
            background: #f4f7f6;
            color: #2c3e50;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* จัดเป็น 3 คอลัมน์ */
            gap: 4px;
        }

        .card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 6px;
            /* บังคับไม่ให้การ์ดขาดครึ่งหน้าเวลาขึ้นหน้าใหม่ */
            page-break-inside: avoid;
            break-inside: avoid;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #7f8c8d;
            margin-bottom: 3px;
            border-bottom: 1px solid #eee;
            padding-bottom: 2px;
        }

        .line {
            display: flex;
            font-size: 11.5px; /* ลดขนาดตัวอักษรลง */
            line-height: 1.35; /* ลดระยะห่างบรรทัด */
            margin-bottom: 2px;
        }

        .label {
            width: 38px;
            font-weight: bold;
            font-size: 0.7em;
            color: #555;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .content {
            flex: 1;
        }

        /* Keyword Highlight สำหรับตอนปริ้น */
        .content span {
            font-weight: 800;
            background: #ffeaa7;
            color: red;
            border-bottom: 1px solid #fdcb6e;
            padding: 0 3px;
            border-radius: 3px;
            /* บังคับให้ปริ้นสีพื้นหลังติดมาด้วย */
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        @media print {
            @page { margin: 8mm; } /* บังคับขอบกระดาษให้แคบลงอัตโนมัติ */
            body { padding: 0; background: #fff; }
            .grid { gap: 2px; }
            .card { border: 0.5px solid #999; box-shadow: none; border-radius: 0; padding: 4px; }
        }
    </style>
</head>
<body>

    <div class="grid" id="printableGrid">
        <div style="text-align: center; grid-column: 1 / -1;">
            <h2>Loading data for printing...</h2>
        </div>
    </div>

    <script>
        // ดึงข้อมูลจากไฟล์แล้วจัดเรียงลงในหน้าเว็บ
        async function loadAndRender() {
            try {
                const response = await fetch('./data_with_highlights.txt');
                const sentences = await response.json();
                const grid = document.getElementById('printableGrid');
                grid.innerHTML = ''; // Clear loading text
                
                sentences.forEach(s => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="header">
                            <span>ID: ${s.id}</span>
                            <span>${s.group}</span>
                        </div>
                        <div class="line"><div class="label">ENG:</div><div class="content">${s.en}</div></div>
                        <div class="line"><div class="label">IPA:</div><div class="content">${s.ipa}</div></div>
                        <div class="line"><div class="label">CHI:</div><div class="content">${s.ch}</div></div>
                        <div class="line"><div class="label">PY:</div><div class="content">${s.py}</div></div>
                        <div class="line"><div class="label">THAI:</div><div class="content">${s.th}</div></div>
                    `;
                    grid.appendChild(card);
                });

                // เปิดหน้าต่าง Print อัตโนมัติเมื่อเรนเดอร์เสร็จ (หน่วงเวลา 1 วิให้เบราว์เซอร์เตรียมตัว)
                setTimeout(() => {
                    window.print();
                }, 1000);
                
            } catch (error) {
                console.error("Error loading data:", error);
                document.getElementById('printableGrid').innerHTML = "<h1>Error: Please open via Live Server</h1>";
            }
        }

        loadAndRender();
    </script>
</body>
</html>
